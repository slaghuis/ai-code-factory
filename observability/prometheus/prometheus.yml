global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cache-proxy
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: telegram-mcp
    static_configs:
      - targets: ['host.docker.internal:8765']

  - job_name: pipeline-mcp
    static_configs:
      - targets: ['host.docker.internal:8766']

  - job_name: design-mcp
    static_configs:
      - targets: ['host.docker.internal:8767']

  - job_name: metrics-exporter
    static_configs:
      - targets: ['host.docker.internal:9101']

  - job_name: qdrant
    static_configs:
      - targets: ['host.docker.internal:6333']
    metrics_path: /metrics