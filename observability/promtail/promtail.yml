server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ai-factory
    static_configs:
      - targets: [localhost]
        labels:
          job: ai-factory
          __path__: /var/log/ai-factory/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<ts>\S+)\s+(?P<level>\S+)\s+(?P<msg>.*)'
      - labels:
          level: